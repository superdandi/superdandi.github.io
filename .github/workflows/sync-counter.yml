name: Sync visitor counter

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch visitor count from badge
        run: |
          SVG=$(curl -sL "https://visitor-badge.laobi.icu/badge?page_id=superdandi.github.io")
          COUNT=$(echo "$SVG" | grep -oP 'y="140"[^>]*>\K\d+' | tail -1)
          echo "Current count: $COUNT"
          echo "$COUNT" > /tmp/current_count.txt

      - name: Read current counter.json
        id: read
        run: |
          if [ -f counter.json ]; then
            CURRENT=$(jq '.count' counter.json)
          else
            CURRENT=0
          fi
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Update counter.json if changed
        run: |
          NEW_COUNT=$(cat /tmp/current_count.txt)
          CURRENT=${{ steps.read.outputs.current }}
          if [ "$NEW_COUNT" != "$CURRENT" ]; then
            echo "{\"count\": $NEW_COUNT}" > counter.json
            echo "Updated: $CURRENT → $NEW_COUNT"
          else
            echo "No change (count: $CURRENT)"
          fi

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet counter.json; then
            git config user.name "superdandi-bot"
            git config user.email "bot@superdandi.dev"
            git add counter.json
            git commit -m "sync: visitor count updated [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
